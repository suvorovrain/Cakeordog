[project]
name = "cakeordog"
version = "0.1.0"
description = "Classificator for Muffin vs chihuahua dataset https://www.kaggle.com/datasets/samuelcortinhas/muffin-vs-chihuahua-image-classification/data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ipykernel>=7.1.0",
  "ipython>=9.9.0",
  "ipywidgets>=8.1.8",
  "joblib>=1.5.3",
  "nbqa>=1.9.1",
  "numpy>=1.24.0",
  "pandas>=2.3.3",
  "pandas-stubs>=2.3.3.251219",
  "scikit-image>=0.24.0",
  "scikit-learn>=1.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
]
ignore = [
  "E501", # line too long
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # unused import at __init__.py

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/cakeordog --cov-report=term-missing --cov-report=html"

[dependency-groups]
dev = [
  "black>=24.8.0",
  "black[jupyter]>=25.11.0",
  "mypy>=1.14.1",
  "pytest>=8.3.5",
  "pytest-cov>=5.0.0",
  "ruff>=0.14.8",
  "sphinx>=7.1.2",
  "sphinx-rtd-theme>=1.3.0",
  "sphinx-autodoc-typehints>=1.25.3",
  "myst-parser>=2.0.0",
]
